<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 12px;
      min-width: 160px;
      background: #1e1e1e;
      color: #eee;
    }
    button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin: 4px 0;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      background: #2a2a2a;
      color: #eee;
      cursor: pointer;
      text-align: left;
    }
    button:hover {
      background: #3a3a3a;
    }
    button:active {
      background: #4a90d9;
    }
  </style>
</head>
<body>
  <button id="save">Save now</button>
  <button id="options">Options</button>
  <script src="popup.js"></script>
</body>
</html>
